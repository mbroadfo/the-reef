[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-reef"
version = "0.1.0"
description = "The Reef 2.0: event-sourced paper-trading engine with competing strategy pods (no live trading, no LLM calls)"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13",
]

[dependency-groups]
test = ["pytest>=8", "exchange-calendars>=4.13"]
# Only for tools/fetch_history.py, which downloads free daily bars once into an untracked local cache.
data = ["yfinance>=1.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
